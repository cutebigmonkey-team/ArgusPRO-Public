name: ARGUS Ingestion Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingestion-tests:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Validate ingestion contract and queue
        env:
          PYTHONPATH: ops/ingest
        run: |
          python -m unittest discover \
            -s ops/ingest \
            -p 'test_*.py' \
            -v
