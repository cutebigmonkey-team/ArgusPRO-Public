name: ARGUS public collection - read-only
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
    - cron: '2,17,32,47 * * * *'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s ops/collect -p 'test_pilot_runtime.py' -v
      - run: python -m unittest discover -s ops/collect -p 'test_platform_workers.py' -v
  fast-validation:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/argus-collection-lane.yml
    with:
      lane: fast
      validation_only: true
  extended-validation:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/argus-collection-lane.yml
    with:
      lane: extended
      validation_only: true
  fast:
    if: github.event.repository.private == false && github.event_name != 'pull_request' && (github.event_name != 'schedule' || github.event.schedule == '*/5 * * * *')
    uses: ./.github/workflows/argus-collection-lane.yml
    with:
      lane: fast
    secrets:
      public_sources: ${{ secrets.ARGUS_PUBLIC_COLLECT_SOURCES_JSON }}
  extended:
    if: github.event.repository.private == false && github.event_name != 'pull_request' && (github.event_name != 'schedule' || github.event.schedule == '2,17,32,47 * * * *')
    uses: ./.github/workflows/argus-collection-lane.yml
    with:
      lane: extended
    secrets:
      public_sources: ${{ secrets.ARGUS_PUBLIC_COLLECT_SOURCES_JSON }}
