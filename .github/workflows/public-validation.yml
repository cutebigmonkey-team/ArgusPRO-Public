name: Public repository validation (no production access)
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    # Do not consume private-repository quota during migration preparation.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test publication controls
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s ops/security -p 'test_*.py' -v
      - name: Redacted publication policy and history scan
        run: python ops/security/publication_audit.py --output "$RUNNER_TEMP/publication-private.json"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: ${{ !cancelled() }}
        with:
          go-version: '1.25.x'
          cache: false
      - name: Gitleaks full history and working tree (redacted)
        if: ${{ !cancelled() }}
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner --log-opts='--all' .
          "$(go env GOPATH)/bin/gitleaks" dir --redact=100 --ignore-gitleaks-allow --no-banner .
  frontend:
    if: github.event.repository.private == false
    needs: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Exact Node frontend manifest, tests and syntax
        run: docker build --target comments-ui-check -f ops/hostless/Dockerfile .
  release:
    if: github.event.repository.private == false
    needs: security
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: /app/ops/collect:/app/ops/drive:/app/ops/local-storage:/app/ops/hostless
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build exact runtime dependencies and browser assets
        id: runtime
        run: docker build --target worker-source -t argus-validation-runtime -f ops/hostless/Dockerfile .
      - name: Real Crawlee and Crawl4AI fixtures (no social network access)
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          docker run --rm -e PYTHONPATH argus-validation-runtime python -m unittest -v \
            test_enhanced.EnhancedTests.test_both_real_engines_follow_queue_and_keep_identical_identity \
            test_enhanced.EnhancedTests.test_real_crawl4ai_markdown_is_offline_and_article_only
      - name: Private registry fail-closed fixtures (no Drive credentials)
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: docker run --rm -e PYTHONPATH argus-validation-runtime python -m unittest -v test_runtime_catalog
      - name: Chromium browser smoke test on hosted runner
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          python3 -m venv /tmp/argus-browser-venv
          /tmp/argus-browser-venv/bin/pip install playwright==1.56.0
          /tmp/argus-browser-venv/bin/python -m playwright install --with-deps chromium
          /tmp/argus-browser-venv/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True,chromium_sandbox=True); page=b.new_page(); page.set_content("<article>fixture</article>"); assert page.locator("article").inner_text()=="fixture"; b.close(); p.stop()'
      - name: Disposable PostgreSQL, full collector, Hostless and archive suites
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: docker build --target comments-backend-check -f ops/hostless/Dockerfile .
      - name: Exact production target (build only; never run worker)
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: docker build --target production --build-arg ARGUS_SOURCE_SHA="$GITHUB_SHA" -f ops/hostless/Dockerfile .
